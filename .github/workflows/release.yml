# Attaches shipink.zip (top-level shipink/ folder, as PrestaShop requires) to
# every published release. app-ui links releases/latest/download/shipink.zip.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git archive --prefix=shipink/ -o shipink.zip HEAD -- . ':!.github'
      - run: gh release upload "$TAG" shipink.zip --clobber
